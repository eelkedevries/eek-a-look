[project]
name = "scanpaths"
version = "0.1.0"
description = "Predicted fixations (DeepGaze MSDB) and scanpaths (DeepGaze3.5-VL) for eek-a-look's Example section."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
]

[dependency-groups]
# scanpaths.py only: DeepGaze3.5-VL on the GPU. Versions as pinned by the DeepGaze3.5-VL repository, plus
# bitsandbytes for the 4-bit run that fits in 8 GB. The model's code and adapter are downloaded at run time.
gpu = [
  "torch==2.9.0",
  "torchvision==0.24.0",
  "transformers==4.57.6",
  "peft==0.18.1",
  "accelerate==1.12.0",
  "safetensors==0.7.0",
  "bitsandbytes==0.48.2",
  "pillow==11.3.0",
  "scipy==1.16.1",
  "matplotlib==3.10.6",
  "tqdm==4.67.3",
]

[tool.uv]
package = false
